name: Container verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build native probe
        run: DOCKER_BUILDKIT=0 docker build --target probe -t hda:probe -f deploy/Dockerfile .
      - name: Run Linux recovery and policy tests
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:rw,nosuid,nodev,size=256m
          --tmpfs /app/node_modules/.vite-temp:rw,nosuid,nodev,uid=1000,gid=1000,size=16m
          --tmpfs /app/node_modules/.vite:rw,nosuid,nodev,uid=1000,gid=1000,size=32m
          --cap-drop ALL --security-opt no-new-privileges --memory 1g --cpus 2
          hda:probe npm test
      - name: Type check
        run: docker run --rm hda:probe npm run typecheck
      - name: Dependency audit
        run: docker run --rm hda:probe npm audit --audit-level=high
      - name: Build production container
        run: DOCKER_BUILDKIT=0 docker build --target runtime -t hda:runtime -f deploy/Dockerfile .
      - name: Container smoke
        run: node deploy/smoke.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install browser smoke dependencies
        run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compose installation smoke
        run: HDA_TEST_IMAGE=hda:runtime node deploy/compose-smoke.mjs
      - name: Scan production container
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" -w /work \
            aquasec/trivy:0.76.2 image --image-src docker --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed=false \
            --format json --output trivy-results.json --exit-code 0 hda:runtime
      - name: Summarize scan findings
        if: always()
        run: |
          node -e "const fs=require('node:fs');if(!fs.existsSync('trivy-results.json')){console.log('No scan report');process.exit(0)}const r=JSON.parse(fs.readFileSync('trivy-results.json','utf8'));const v=r.Results.flatMap(x=>x.Vulnerabilities??[]);const high=v.filter(x=>x.Severity==='HIGH').length,critical=v.filter(x=>x.Severity==='CRITICAL').length;console.log('HIGH='+high+' CRITICAL='+critical);fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'### Container scan\\n\\nHIGH: '+high+'  CRITICAL: '+critical+'\\n\\nThe release gate stays blocked while findings remain. See trivy-results.json.\\n')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.runner }}
          path: trivy-results.json
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/web ci
      - run: npm run build:all
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:web-console
      - run: npm --prefix apps/web run test:integration
      - name: Synthetic outage soak harness smoke
        run: npm run test:soak -- --duration-seconds=15 --interval-seconds=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-soak-evidence
          path: |
            test-results/
            artifacts/control-soak.json
          if-no-files-found: ignore
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.3 detect --source /repo --redact --no-banner
