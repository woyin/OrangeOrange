name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Install dependencies
        run: npm ci && npm --prefix apps/web ci
      - name: Type check
        run: npm run typecheck && npm run typecheck:web
      - name: Unit and contract tests
        run: npm test
      - name: Build server and web
        run: npm run build:all
      - name: Frontend event and HTTP client tests
        run: npm run test:web-console && npm --prefix apps/web run test:integration
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Release gate status (informational)
        continue-on-error: true
        run: npm run release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
